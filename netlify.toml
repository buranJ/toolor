# Files under public/ are served straight from the CDN and, unlike the hashed
# build output, got `cache-control: public, max-age=0, must-revalidate`. Nothing
# was reused between visits, so the scroll-driven hero re-fetched its video on
# every load and could not lean on the cache while seeking.
#
# Not `immutable`: the hero assets keep their filenames across re-encodes, so a
# year-long lock would strand visitors on an old cut.
[[headers]]
  for = "/media/*"

  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/fonts/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pretty URL for the link-in-bio page, handled at the CDN edge.
#
# There is a matching rewrite in next.config.ts, and both are needed: that one
# serves /links during `next dev` and `next start`, where the whole public/
# folder sits on disk. In the deployed serverless runtime public/ is on the CDN
# rather than in the function bundle, so the framework rewrite cannot reach the
# file and the request falls through to the app's 404.
[[redirects]]
  from = "/links"
  to = "/links/index.html"
  status = 200

[[headers]]
  for = "/links/*"

  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
